name: build-rule-sets

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "sing-box-rules"
    paths:
      - "config/rules/index.txt"
      - "config/rules/custom/**"
      - "scripts/singbox_rules.py"
      - "scripts/singbox_rules.test.js"
      - ".github/workflows/build-rule-sets.yml"

# 两次 push 会各自触发一次运行，两次都 force push 同一条发布分支。
# 后跑完的那次覆盖整棵树，所以先触发的那次若后完成，分支上留下的是旧产物。
# 排队而不是取消：取消若恰好落在 force push 中途，分支状态不确定。
concurrency:
  group: build-rule-sets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成器只读工作树，发布走临时仓，都不需要 main 的历史。
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Run generator tests
        run: bun test scripts/singbox_rules.test.js

      - name: Install sing-box
        shell: bash
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo sh
          sing-box version

      - name: Build all rule-sets
        run: uv run python -B scripts/singbox_rules.py build --all

      - name: Prepare publish tree
        shell: bash
        run: |
          rm -rf publish
          mkdir -p publish/singbox publish/clash publish/plain
          cp config/rules/generated/singbox/*.json publish/singbox/
          cp config/rules/generated/singbox/*.srs publish/singbox/
          cp config/rules/generated/clash/*.yaml publish/clash/
          cp config/rules/generated/plain/*.list publish/plain/
          cp config/rules/generated/45-ruleset-remote.json publish/45-ruleset.json

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: rule-sets
          path: publish
          if-no-files-found: error

      - name: Publish latest artifacts to branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm -rf publish-repo
          mkdir publish-repo
          cd publish-repo
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin sing-box-rules; then
            git checkout -B sing-box-rules FETCH_HEAD
          else
            git checkout --orphan sing-box-rules
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../publish/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No artifact changes to publish"
            exit 0
          fi
          TREE_ID="$(git write-tree)"
          COMMIT_ID="$(printf '%s\n' 'build: update rule sets' | git commit-tree "${TREE_ID}")"
          git reset --hard "${COMMIT_ID}"
          git push --force origin HEAD:sing-box-rules
