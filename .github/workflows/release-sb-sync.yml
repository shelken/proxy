# sb-sync 单二进制发布：打 tag 后编译三平台产物并上传 GitHub Release。
#
# 产物消费者：
#   - macOS：mise [tools."github:shelken/proxy"]（客户端 encode/keygen）
#   - Linux arm64：沙箱 VM 与服务端容器（aarch64 节点）
#   - Linux amd64：服务端容器（amd64 节点，集群 worker 是 Intel）
#
# 每平台在对应原生 runner 上构建，不用 QEMU 模拟：macOS 目标在 macos-15，
# arm64 Linux 在 ubuntu-24.04-arm，amd64 Linux 在 ubuntu-latest。
# 原生构建的附带好处是每个产物都能在其构建机上直接跑 version 冒烟，
# 模拟构建做不到这一点（异架构二进制无法执行）。
name: release-sb-sync

on:
  push:
    tags:
      # 语义版本 tag（mise github 后端按 v<semver> 查询 release）
      - "v*"
  # 手动触发用于验证构建链路本身（不发版、不上传）：Dockerfile 与
  # include_str! 路径这类问题不验证就要等发版才暴露，代价过高
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 三平台二进制产出。tag 与手动触发都编译，只有 tag 会上传。
  binaries:
    name: binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: sb-sync-aarch64-apple-darwin
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            artifact: sb-sync-aarch64-unknown-linux-musl
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: sb-sync-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring（经 rustls）的 build.rs 走 cc-rs 编 C 代码，musl 目标需要 musl-gcc。
      # 两个 runner 都是原生架构（arm64 runner 编 aarch64 目标，amd64 runner 编
      # x86_64 目标），所以系统自带的 musl-tools 就是对的，不需要交叉工具链：
      # 只换 libc，不跨架构。ring 0.17.14 缺这个会在 cc-rs 探测阶段直接失败。
      - name: Install musl toolchain
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Verify musl toolchain
        if: contains(matrix.target, 'linux')
        run: musl-gcc --version

      # 缓存键必须含 target：三平台并行跑，共享键会让不同架构的
      # 构建产物互相覆盖（cargo 会因架构不符而重编或直接报错）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/sb-sync-rs/target
          key: sb-sync-${{ matrix.target }}-${{ hashFiles('scripts/sb-sync-rs/Cargo.lock') }}
          restore-keys: sb-sync-${{ matrix.target }}-

      # 单一事实来源 = git tag；构建前把 tag 写入 Cargo.toml，
      # 避免二进制版本与发布版本漂移。手动触发时 ref 是分支名，不做同步。
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: scripts/sb-sync-rs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm Cargo.toml.bak

      - name: Test
        working-directory: scripts/sb-sync-rs
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        working-directory: scripts/sb-sync-rs
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/sb-sync" "../../${{ matrix.artifact }}"

      # 每个产物在其构建机上原生执行：架构错了或动态链接缺失都会在这里暴露
      - name: Smoke test binary
        run: |
          file "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} version
          ./${{ matrix.artifact }} --help >/dev/null 2>&1 || true

      - name: Assert version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./${{ matrix.artifact }} version | grep -q "sb-sync ${GITHUB_REF_NAME#v}" || {
            echo "二进制版本与 tag 不一致"; exit 1; }

      # Linux musl 产物必须是静态链接：沙箱 VM 与容器都不保证有 glibc 兼容层，
      # 动态链接的二进制会在那里以 "not found"（缺解释器）而不是明确报错失败。
      #
      # 判据是无解释器段，而不是匹配 file 的措辞：rustc 对 x86_64-unknown-linux-musl
      # 默认产出 PIE，file 报 `static-pie linked`；aarch64 同类目标报 `statically linked`。
      # 两者都静态，按字面匹配任一种都会误判另一种（实测踩到）。
      - name: Assert static linkage (linux)
        if: contains(matrix.target, 'linux')
        run: |
          BIN="${{ matrix.artifact }}"
          FILE_OUT=$(file "$BIN")
          echo "$FILE_OUT"
          if echo "$FILE_OUT" | grep -qE 'dynamically linked|shared object'; then
            echo "Linux 产物不应动态链接"; exit 1
          fi
          if readelf -lW "$BIN" | grep -q ' INTERP '; then
            echo "Linux 产物存在解释器段（PT_INTERP），非静态链接"; exit 1
          fi
          echo "$FILE_OUT" | grep -qE 'statically linked|static-pie linked'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # 单独一个 job 汇总上传：三个矩阵 job 并发调 action-gh-release 会竞争创建
  # 同一个 tag 的 release（同时 POST 时后到者收到 422 already_exists）。
  # 先各自传 artifact 再一次性发布，既避免竞争也让发布说明只生成一次。
  release:
    name: publish release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # 每平台原生构建镜像并推送 digest，再由 merge job 组装 manifest list。
  #
  # 二进制直接取自 binaries job 的 artifact，与发布出去的完全同源——镜像内二进制的
  # 架构因此天然与该平台一致，不存在交叉 COPY 装错架构的风险。
  #
  # 不用 QEMU：集群是混合架构（控制平面 arm64、worker amd64），且 Pod 无节点亲和
  # 约束，两种架构都必须能真跑。模拟构建的产物无法在构建机上执行，验不了。
  docker:
    name: image (${{ matrix.platform }})
    needs: binaries
    # tag 上跑是正式发布；workflow_dispatch 也跑，但只推到快照 tag —— 多架构
    # manifest 合并这条路只有在真推一次之后才能确认（imagetools create 的
    # digest 拼接、GHCR 权限都验不到），而它原本只在发版时才第一次执行。
    # 推分支名 tag 会污染镜像 tag 空间，故用 snapshot-<sha> 这种一次性名字。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: sb-sync-aarch64-unknown-linux-musl
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: sb-sync-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      # 镜像构建上下文要求 ./sb-sync，用本平台那份二进制填上
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: image-context

      - name: Stage binary into context
        run: mv image-context/${{ matrix.artifact }} sb-sync

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先在本机加载一份做冒烟：runner 是本平台原生架构，镜像能真跑起来。
      # 只 push by digest 的话只能验「构建成功」，验不了「启动后 /healthz 与 /pubkey 可用」，
      # 而镜像里装的是另一份二进制——架构错或入口坏都只会在拉取时才暴露。
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: sb-sync-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          SK=$(openssl rand -hex 32)
          docker run -d --name sb-sync-smoke -e SERVER_PRIVATE_KEY="$SK" -p 18080:8080 sb-sync-server:smoke
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:18080/healthz)" = "ok"
          PK=$(curl -fsS http://127.0.0.1:18080/pubkey)
          echo "pubkey=$PK"
          test "${#PK}" -eq 64
          echo "$PK" | grep -qE '^[0-9a-f]{64}$'
          # 镜像内二进制的架构必须与本平台一致
          docker exec sb-sync-smoke /usr/local/bin/sb-sync version
          docker logs sb-sync-smoke
          docker rm -f sb-sync-smoke

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 按 digest 推送：多平台各自出一个 manifest，最终合并成 list
          outputs: type=image,name=ghcr.io/${{ github.repository }}/sb-sync-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # 把各平台 digest 合并成 manifest list。单平台 push 只产生架构专属 manifest，
  # 没有这一步 `docker pull` 在另一架构上会失败。
  docker-merge:
    name: merge image manifest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 正式发版才推进 latest；手动触发只落一次性快照，不覆盖已发布镜像
      - name: Resolve tags
        id: tags
        run: |
          REPO="ghcr.io/${{ github.repository }}/sb-sync-server"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "primary=${REPO}:snapshot-${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
            echo "extra=" >> $GITHUB_OUTPUT
          else
            echo "primary=${REPO}:latest" >> $GITHUB_OUTPUT
            echo "extra=-t ${REPO}:${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          REPO="ghcr.io/${{ github.repository }}/sb-sync-server"
          docker buildx imagetools create \
            -t "${{ steps.tags.outputs.primary }}" ${{ steps.tags.outputs.extra }} \
            $(printf "${REPO}@sha256:%s " *)

      # 列出结果确认两个架构都在 list 里——漏了架构不会有别的信号
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "${{ steps.tags.outputs.primary }}"
