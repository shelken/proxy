# sb-sync 单二进制发布：打 tag 后编译 arm64 macOS 产物并上传 GitHub Release。
# 产物消费者：mise [tools."github:shelken/proxy"] 与无 nix 设备的手动安装。
name: release-sb-sync

on:
  push:
    tags:
      # 语义版本 tag（mise github 后端按 v<semver> 查询 release）
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/sb-sync-rs/target
          key: sb-sync-${{ hashFiles('scripts/sb-sync-rs/Cargo.lock') }}

      - name: Sync version with tag
        working-directory: scripts/sb-sync-rs
        run: |
          # 单一事实来源 = git tag；构建前把 tag 写入 Cargo.toml，避免二进制版本与发布版本漂移
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm Cargo.toml.bak

      - name: Test
        working-directory: scripts/sb-sync-rs
        run: cargo test --release

      - name: Build sb-sync (arm64 macOS)
        working-directory: scripts/sb-sync-rs
        run: cargo build --release && cp target/release/sb-sync ../../sb-sync-aarch64-apple-darwin

      - name: Smoke test binary
        run: |
          file sb-sync-aarch64-apple-darwin
          ./sb-sync-aarch64-apple-darwin version | grep -q "sb-sync ${GITHUB_REF_NAME#v}" || { echo "version 不匹配"; exit 1; }
          HOME="$(mktemp -d)" ./sb-sync-aarch64-apple-darwin init

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: sb-sync-aarch64-apple-darwin
          generate_release_notes: true
