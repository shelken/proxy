# sb-sync Rust 门禁：格式化、严格 lint、全量测试。所有编译校验都在这里做。
# 严格规则同时写在 src/lib.rs 与 src/main.rs 的 cfg 属性里，本工作流只需 -D warnings。
name: ci-sb-sync

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/sb-sync-rs/**"
      - "config/sing-box/template.json"
      - ".mise.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "justfile"
      - "config/sing-box/lima.yaml"
      - ".github/workflows/ci-sb-sync.yml"
      - ".github/workflows/release-sb-sync.yml"
  # pull_request 不按路径过滤：版本 PR 与只改构建文件的 PR 也要拿到确定终态，
  # 否则检查列表停在 Pending、无从判断。省算力交给上面的 push paths。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sb-sync-rs
    steps:
      - uses: actions/checkout@v5

      # 与 Cargo.lock 里 icu_* 的要求（rustc ≥1.88）对齐，并带来 rustfmt/clippy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/sb-sync-rs/target
          key: ci-sb-sync-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-sb-sync-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # 严格 lint 规则在 crate 属性中声明；此处统一把警告升级为错误
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # e2e 测试要真跑 sing-box merge，用 mise 按 .mise.toml 装内核。
      # 版本只在 .mise.toml 声明，这里不写版本号
      - uses: jdx/mise-action@v4
        with:
          cache: false
          install_args: sing-box

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo build (release)
        run: |
          cargo clean
          cargo build --release --locked

  # 镜像只在打 tag 时构建的话，Dockerfile 坏了要等发版才暴露（include_str! 路径
  # 与 rust 版本都踩过这个坑）。这里每次改动都真构建一次，不推送。
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 必须编 musl 目标：运行镜像是 alpine，gnu 产物缺 glibc 解释器会以
          # "executable file not found" 静默退出，端口根本不会监听
          targets: x86_64-unknown-linux-musl

      # ring（经 rustls）走 cc-rs 编 C 代码，musl 目标需要 musl-gcc
      - name: Install musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/sb-sync-rs/target
          key: ci-sb-sync-docker-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-sb-sync-docker-

      # 镜像已改为 COPY 预编译二进制，构建上下文里必须先有它。
      # 这里与 release 工作流同源同目标，避免「CI 绿但发版炸」。
      - name: Build binary
        working-directory: scripts/sb-sync-rs
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/sb-sync ../../sb-sync

      - uses: docker/setup-buildx-action@v3

      # 镜像基底内核版本只在 .mise.toml 声明；这里只取 mise CLI，不装内核
      - uses: jdx/mise-action@v4
        with:
          cache: false
          install: false

      - name: Resolve kernel version
        id: kernel
        run: |
          set -euo pipefail
          V=$(mise config get --file .mise.toml tools.sing-box)
          test -n "$V" || { echo "无法从 .mise.toml 读取 sing-box 版本"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SING_BOX_VERSION=${{ steps.kernel.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: sb-sync-server:ci

      # 起容器验一次真实链路：/healthz 通、/pubkey 返回合法公钥
      - name: Smoke test image
        run: |
          SK=$(openssl rand -hex 32)
          docker run -d --name sb-sync-ci -e SERVER_PRIVATE_KEY="$SK" -p 18080:8080 sb-sync-server:ci
          # 与 release 工作流同因：容器接受连接却不响应时，无超时的 curl 会挂到
          # job 上限而非在 20 秒内失败，冒烟步骤就失去快速失败的意义。
          for _ in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          test "$(curl -fsS --max-time 5 http://127.0.0.1:18080/healthz)" = "ok"
          PK=$(curl -fsS --max-time 5 http://127.0.0.1:18080/pubkey)
          echo "pubkey=$PK"
          # 与私钥推导出的公钥必须一致（长度 64 且为十六进制）
          test "${#PK}" -eq 64
          echo "$PK" | grep -qE '^[0-9a-f]{64}$'
          docker rm -f sb-sync-ci
