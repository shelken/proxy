# 快照镜像回收：release-sb-sync.yml 的手动触发会推 snapshot-<sha> 镜像用于
# 验证多架构 manifest 链路，它们是一次性产物，不清理会无限积累。
#
# 用 dataaxiom/ghcr-cleanup-action 而不是手写 Packages API 循环：它会解析镜像
# 索引的引用关系，避免删掉仍被 v* / latest 引用的平台 child manifest。
name: cleanup-snapshot-images

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出将删除的对象，不实际删除"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# 与 release-sb-sync.yml 的 docker-merge 同一组：两边都在改镜像索引，不能并发
concurrency:
  group: sb-sync-registry-publication
  cancel-in-progress: false

jobs:
  cleanup:
    name: prune snapshot images
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # 实测的包 slug（gh api /users/shelken/packages/container/proxy%2Fsb-sync-server）
          package: proxy/sb-sync-server
          delete-tags: snapshot-*
          exclude-tags: latest,v*
          older-than: 14 days
          # 不删无 tag 镜像：正在推送、尚未合并的 digest 会短暂处于这个状态
          delete-untagged: false
          delete-partial-images: false
          delete-ghost-images: false
          delete-orphaned-images: false
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
