# 规则清单 —— 本仓库是唯一权威规则源
#
# 格式：tag: source
#   tag     产物文件名，也是 sing-box 里的 rule_set tag
#   source  仓库相对路径则读本地文件；以 http 开头则按 URL 拉取
#
# 只编辑本文件与 custom/ 下的列表：各客户端产物（sing-box .srs / clash yaml / plain）
# 由 scripts/rules-compile.ts 编译，CI 自动发布到 sing-box-rules 分支，底模按
# update_interval 远程引用。详见 config/rules/README.md
#
# 键按 ASCII 忽略大小写排序，同字母大小写相邻。纯数字开头的 tag 须加引号（如 "1024proxy"），
# 否则 YAML 会解析成数字键。

