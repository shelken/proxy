rules:
  - domain:
      - cdn.usefathom.com
      - servd-anthropic-website.b-cdn.net
      - anthropic.auth0.com
      - anthropic.com.cdn.cloudflare.net
  - domain_suffix:
      - anthropic.com
      - clau.de
      - claude.ai
      - claude.com
      - claude.dev
      - claudemcpclient.com
      - claudemcpcontent.com
      - claudeusercontent.com
