# Oculus / Meta Quest 遥测与数据上报封禁
#
# 目标：拦截后台遥测、事件上报与第三方追踪，保留商店下载（securecdn/oculuscdn）、
# 账号登录（facebook.com）与设备鉴权（graph.facebook-hardware.com）正常工作。
#
# 来源聚合（去重 89 条，按证据强度分两组）：
#   - Nuvido/Quest2_Research：Quest 2 固件逆向，端点与上报字段直接来自系统应用代码
#   - hagezi/dns-blocklists share/facebook.txt：22 条，附用途注释
#   - micahsellis/Meta-Quest-Adgard-DNS-Blocklist：54 条 AdGuard 格式
#   - ibrah3m/pihole-meta-quest-blocklist：66 条 Pi-hole 格式（与 micahsellis 高度重叠）
#   - v2fly/domain-list-community data/oculus：17 条 Oculus 品牌域名

rules:
  # --- 确定遥测 / 数据上报 / 追踪端点（精确匹配） ---
  - domain:
      # graph.* — Meta Graph API 系列，承载事件上报与遥测
      - graph.facebook.com        # Nuvido: /logging_client_events — Unified Telemetry，上报设备状态/电池/位置/应用列表
      - graph.oculus.com           # Nuvido: /report_bug + /facebook_access_token_generate — 双重用途，出问题摘这一条
      - graph.fbpigeon.com         # hagezi: pigeon 是 Meta 遥测传输协议
      - b-graph.facebook.com       # hagezi: Graph API 变体
      - b-graph-fallback.facebook.com
      - graph-fallback.facebook.com
      - z-m-graph.facebook.com
      - graph.m-freeway.com
      - meta.graph.meta.com        # micahsellis: Meta graph 遥测
      - realitylabs-graph.facebook.com  # micahsellis: Reality Labs graph

      # MQTT / 信令 — 事件推送与通知通道
      - edge-mqtt.facebook.com     # micahsellis: MQTT 遥测传输
      - mqtt-mini.facebook.com     # hagezi: 通知/MQTT

      # 上报网关 / 上传
      - portal.fb.com              # micahsellis: 数据上报门户
      - gateway.facebook.com       # micahsellis: 网关
      - rupload.facebook.com       # micahsellis: 可复用上传（媒体/数据）
      - shortwave.facebook.com     # ibrah3m: 固件级阻断清单

      # ep1-9 — hagezi 标注第三方追踪，用途不明但确认非功能性
      - ep1.facebook.com
      - ep2.facebook.com
      - ep6.facebook.com
      - ep7.facebook.com
      - ep8.facebook.com
      - ep9.facebook.com

      # Google beacons — 遥测信标
      - beacons.gvt2.com
      - beacons.gcp.gvt2.com
      - beacons5.gvt2.com

  # --- 确定 Oculus 品牌域名（后缀匹配，来自 v2fly geosite:oculus） ---
  # 排除 oculus.com（含 securecdn.* 商店下载、www.* 登录）与 oculuscdn.com（内容 CDN）
  - domain_suffix:
      - binoculus.com
      - buyoculus.com
      - ocul.us
      - oculus-china.com
      - oculus2014.com
      - oculus3d.com
      - oculusblog.com
      - oculusbrand.com
      - oculuscasino.net
      - oculusconnect.com
      - oculusdiving.com
      - oculusforbusiness.com
      - oculusrift.com
      - oculusvr.com
      - powersunitedvr.com

