# base.yaml — 三份底模共享的原生字段：DNS 服务器与全局、固定出站、路由全局、面板与 HTTP 客户端。
# 用户日常只改 settings.yaml。这里只有 sing-box 原生字段，没有自定义指令；
# 与设置相关的路由/DNS 规则由 scripts/build-config.ts 的 makePolicy 生成。

log:
  level: info

dns:
  servers:
    - { type: udp, tag: dns-direct-cn, server: 223.5.5.5 }
    - type: https
      tag: dns-proxy
      server: 1.1.1.1
      detour: dns-auto
      tls: { enabled: true, server_name: cloudflare-dns.com }
    - { type: fakeip, tag: dns-fakeip, inet4_range: 198.18.0.0/15 }
  strategy: prefer_ipv4
  optimistic: true
  final: dns-proxy

http_clients:
  - { tag: rule-set-dl, detour: rule-set-dl-group }

experimental:
  clash_api: { external_controller: 127.0.0.1:9090, external_ui: ui, default_mode: rule }
  cache_file: { enabled: true, path: cache.db, store_fakeip: true, store_dns: true }

outbounds:
  - { type: direct, tag: direct }
  - type: urltest
    tag: dns-auto
    outbounds: ["(?i)(vps|hy2|selfhost)", "(?i)(港|HK|Hong)", "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)", "(?i)(新加坡|坡|狮城|SG|Singapore)"]
    url: https://www.gstatic.com/generate_204
    interval: 1m
    tolerance: 50
    interrupt_exist_connections: true
  - type: urltest
    tag: rule-set-dl-group
    outbounds: ["(?i)anytls", ".*"]
    url: https://www.gstatic.com/generate_204
    interval: 1m
    tolerance: 50
    interrupt_exist_connections: true
  - type: selector
    tag: selfhost
    outbounds: ["(?i)hy2.*v6", "(?i)anytls", "(?i)hy2", "(?i)(vps|hy2|selfhost)"]
    interrupt_exist_connections: true
  - type: selector
    tag: proxy
    outbounds: [selfhost, ".*"]
    default: selfhost
    interrupt_exist_connections: true
  - type: urltest
    tag: hk
    outbounds: ["(?i)(港|HK|Hong)"]
    url: http://www.gstatic.com/generate_204
    interval: 10m0s
    tolerance: 50
    interrupt_exist_connections: true
  - type: urltest
    tag: jp
    outbounds: ["(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"]
    url: http://www.gstatic.com/generate_204
    interval: 10m0s
    tolerance: 50
    interrupt_exist_connections: true
  - type: urltest
    tag: us
    outbounds: ["(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"]
    url: http://www.gstatic.com/generate_204
    interval: 10m0s
    tolerance: 50
    interrupt_exist_connections: true
  - type: urltest
    tag: tw
    outbounds: ["(?i)(台|TW|Tai)"]
    url: http://www.gstatic.com/generate_204
    interval: 10m0s
    tolerance: 50
    interrupt_exist_connections: true
  - type: urltest
    tag: sg
    outbounds: ["(?i)(新加坡|坡|狮城|SG|Singapore)"]
    url: http://www.gstatic.com/generate_204
    interval: 10m0s
    tolerance: 50
    interrupt_exist_connections: true
  - type: urltest
    tag: kr
    outbounds: ["(?i)(KR|Korea|KOR|首尔|韩|韓)"]
    url: http://www.gstatic.com/generate_204
    interval: 10m0s
    tolerance: 50
    interrupt_exist_connections: true
  - type: selector
    tag: torrent
    outbounds: [direct, selfhost, proxy]
    default: direct
    interrupt_exist_connections: true
  - type: selector
    tag: download
    outbounds: [selfhost, proxy, direct, ".*"]
    default: selfhost
    interrupt_exist_connections: true

route:
  auto_detect_interface: true
  final: proxy
  default_domain_resolver: { server: dns-lan }
  default_http_client: rule-set-dl
