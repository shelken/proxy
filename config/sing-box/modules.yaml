rule_set_url: "https://raw.githubusercontent.com/shelken/proxy/sing-box-rules/singbox/{tag}.srs"

services:
  - rule_set: Gemini
    outbound: gemini
    group:
      outbounds: [openai, selfhost, proxy, "(?i)(日本|川日|东京|大阪|JP|Japan)"]
      default: openai
  - rule_set: OpenAI
    outbound: openai
    group:
      outbounds: [selfhost, proxy, "(?i)(港|日本|台湾|GPT|美)"]
      default: selfhost
  - rule_set: Anthropic
    outbound: anthropic
    group:
      outbounds: [openai, selfhost, "(?i)(新加坡|坡|狮城|SG|Singapore|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"]
      default: openai
  - rule_set: Apple-AI
    outbound: appleai
    group:
      outbounds: [direct, selfhost, proxy]
      default: selfhost
  - rule_set: opencode
    outbound: opencode
    group:
      outbounds: [proxy, selfhost, ".*"]
      default: proxy
  - rule_set: zai
    outbound: zai
    group:
      outbounds: [proxy, selfhost, ".*"]
      default: proxy
  - rule_set: grok
    outbound: grok
    group:
      outbounds: [proxy, selfhost, ".*"]
      default: proxy
  - rule_set: 1024proxy
    outbound: 1024proxy
    group:
      outbounds: [proxy, selfhost, "(?i)1024"]
      default: proxy
  - rule_set: dev
    outbound: dev
    group:
      outbounds: [selfhost, proxy, "(?i)(港|HK|Hong)"]
      default: selfhost
  - rule_set: ptcg
    outbound: ptcg
    group:
      outbounds: [selfhost, proxy, direct, "(?i)(日本|JP)"]
      default: selfhost
  - rule_set: Japan
    outbound: japansite
    group:
      outbounds: [proxy, selfhost, "(?i)(日本|川日|东京|大阪|JP|Japan)"]
      default: proxy
  - rule_set: Adult
    outbound: adultnsfw
    group:
      outbounds: [selfhost, proxy, direct, "(?i)(vps|hy2|港)"]
      default: selfhost
  - rule_set: Microsoft
    outbound: microsoft
    group:
      outbounds: [direct, proxy]
      default: direct
  - rule_set: PayPal
    outbound: paypal
    group:
      outbounds: [direct, proxy]
      default: direct
  - rule_set: Apple
    outbound: apple
    group:
      outbounds: [direct, proxy, selfhost]
      default: direct

catalog:
  dns: [Lan-dns, MyDirect-dns, MyReject-dns, MyProxy-dns, ChinaMax-dns]
  reject: [Advertising, Hijacking, MyReject, Privacy]
  download: [Download]
  own-lists: [MyDirect, MyProxy]
  route-tail: [ChinaMax, Lan, cftunnel, geoip-cn, Facebook, Instagram, Spotify, Telegram, TikTok, Twitter, YouTube]

roles:
  mac:
    - { fragment: base/inbounds.json }
    - { fragment: base/dns-lan-resolver.json }
