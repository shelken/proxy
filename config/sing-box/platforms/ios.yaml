# yaml-language-server: $schema=https://sing-box.sagernet.org/schema.json
# ios.yaml — iOS 的完整模板，内嵌 Tailscale，结构与 sing-box 的 JSON 一致（ADR-0010）。
# { $include: 名字 } 引入 shared.yaml 的共用段，settings.yaml 生成的段名字是 groups、rule-sets、services。

log: { $include: log }

inbounds:
  - type: tun
    tag: tun-in
    # 只配 IPv4：SideStore 的 minimuxer 会丢弃带 IPv6 的 utun，探测前就淘汰了回环接口（#167）。
    # Mac 与路由器保持双栈，见 docs/adr/0016
    address: [198.51.100.1/30]
    auto_route: true
    dns_mode: hijack
    loopback_address: ["10.7.0.1"] # for sidestore
    # SideStore 的 minimuxer 只在 utun 路由表里找设备地址，被 0.0.0.0/0 吞掉的 10.7.0.1 找不到。
    # iOS 客户端把 route_address 原样交给系统（不合并），所以 /32 会成为独立路由；
    # 写了 route_address 就不再有默认路由，必须自己补 0.0.0.0/0。IPv6 不写，保持默认。
    route_address: [0.0.0.0/0, 10.7.0.1/32]
    route_exclude_address:
      - 224.0.0.0/4
      - 255.255.255.255/32
      - fe80::/10
  - { type: mixed, tag: mixed-in, listen: 127.0.0.1, listen_port: 2080 }

endpoints:
  - type: tailscale
    tag: ts-ep
    state_directory: tailscale-ios
    hostname: singbox-ios
    accept_routes: true
    system_interface: false

dns:
  $include: dns-options
  servers:
    - type: tailscale
      tag: dns-ts
      endpoint: ts-ep
      accept_default_resolvers: false
      accept_search_domain: true
    - { type: local, tag: dns-lan }
    - { $include: dns-servers }
  rules:
    # Peer 的 DNS 查询绕过 route.rules 直接进 dnsRouter，路由层入站拒绝覆盖不到
    - { inbound: [ts-ep], action: reject }
    - { preferred_by: dns-ts, server: dns-ts, disable_optimistic_cache: true }
    - { domain_suffix: [.int.ooooo.space], query_type: [A], action: predefined, answer: ["*. IN A 192.168.69.46"] }
    - { domain_suffix: [int.ooooo.space], action: predefined }
    - { $include: dns-rules }

http_clients:
  - { $include: http-clients }

experimental: { $include: experimental }

outbounds:
  - { $include: outbounds }
  - { $include: groups }

route:
  $include: route-options
  rules:
    - { inbound: [ts-ep], action: reject }
    - { $include: route-intake }
    - { preferred_by: ts-ep, action: route, outbound: ts-ep }
    - { $include: route-policy }
    - { $include: services }
  rule_set:
    - { $include: rule-sets }
