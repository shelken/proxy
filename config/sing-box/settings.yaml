# settings.yaml — 日常维护入口：共享分流规则与出站分组。
#
# 三份底模（Mac / iOS / 路由器）是 platforms/*.yaml 里各自完整的模板，引入共用段 shared.yaml 与本文件生成的内容，
# 改这里即三端生效。
#   groups  出站分组，客户端面板显示的就是它们：options 是候选（正则，沿用 sing-box selector 语义），
#           其余字段（default、type、url……）原样写进 sing-box 出站，不写 type 即 selector；
#           组名可被 rules 的 to 引用，也可被其他组的 options 引用。
#   rules   共享规则，顺序即首匹配顺序：
#             name    规则名，同时是产物文件名与 sing-box rule_set tag
#             source  规则来源：本地 YAML（相对本文件）/ geosite:x / geoip:x / 外部 .srs URL
#             to      去向：reject / direct / 本文件里的分组名
#
# 去向为 reject、download 的规则由 shared.yaml 的 route-policy 引入，位置固定在前面；
# 其余规则按这里的顺序追加在最后。route-policy 与 DNS 规则直接引用本文件的规则名，
# 删除或改名被引用的规则时，构建会报错并指出规则集名。

# 自动测速组的公共字段，下面的地区组用 <<: *urltest 引用
x-urltest: &urltest { type: urltest, url: http://www.gstatic.com/generate_204, interval: 10m0s, tolerance: 50 }

groups:
  selfhost: { options: ["(?i)hy2.*v6", "(?i)anytls", "(?i)hy2", "(?i)(vps|hy2|selfhost)"] }
  proxy: { options: ["selfhost", ".*"], default: selfhost }
  hk: { <<: *urltest, options: ["(?i)(港|HK|Hong)"] }
  jp: { <<: *urltest, options: ["(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"] }
  us: { <<: *urltest, options: ["(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"] }
  tw: { <<: *urltest, options: ["(?i)(台|TW|Tai)"] }
  sg: { <<: *urltest, options: ["(?i)(新加坡|坡|狮城|SG|Singapore)"] }
  kr: { <<: *urltest, options: ["(?i)(KR|Korea|KOR|首尔|韩|韓)"] }
  torrent: { options: ["direct", "selfhost", "proxy"], default: direct }
  download: { options: ["selfhost", "proxy", "direct", ".*"], default: selfhost }
  gemini:
    options: [openai, selfhost, proxy, "(?i)(日本|川日|东京|大阪|JP|Japan)"]
    default: openai
  openai:
    options: [selfhost, proxy, "(?i)(港|日本|台湾|GPT|美)"]
    default: selfhost
  anthropic:
    options: [openai, selfhost, "(?i)(新加坡|坡|狮城|SG|Singapore|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"]
    default: openai
  appleai:
    options: [direct, selfhost, proxy]
    default: selfhost
  opencode:
    options: [proxy, selfhost, ".*"]
    default: proxy
  zai:
    options: [proxy, selfhost, ".*"]
    default: proxy
  grok:
    options: [proxy, selfhost, ".*"]
    default: proxy
  "1024proxy":
    options: [proxy, selfhost, "(?i)1024"]
    default: proxy
  dev:
    options: [selfhost, proxy, "(?i)(港|HK|Hong)"]
    default: selfhost
  ptcg:
    options: [selfhost, proxy, direct, "(?i)(日本|JP)"]
    default: selfhost
  japansite:
    options: [jp, proxy, selfhost, "(?i)(日本|川日|东京|大阪|JP|Japan)"]
    default: jp
  adultnsfw:
    options: [selfhost, proxy, direct, "(?i)(vps|hy2|港)"]
    default: selfhost
  microsoft:
    options: [direct, proxy]
    default: direct
  paypal:
    options: [direct, proxy]
    default: direct
  apple:
    options: [direct, proxy, selfhost]
    default: direct

rules:
  - name: Advertising
    source: geosite:category-ads-all
    to: reject
  - name: Hijacking
    source: ../rules/custom/Hijacking.yaml
    to: reject
  - name: MyReject
    source: ../rules/custom/MyReject.yaml
    to: reject
  - name: Privacy
    source: ../rules/custom/Privacy.yaml
    to: reject
  - name: OculusTelemetry
    source: ../rules/custom/OculusTelemetry.yaml
    to: reject

  - name: Download
    source: ../rules/custom/Download.yaml
    to: download

  - name: MyDirect
    source: ../rules/custom/MyDirect.yaml
    to: direct
  - name: MySelfhost
    source: ../rules/custom/MySelfhost.yaml
    to: selfhost
  - name: MyProxy
    source: ../rules/custom/MyProxy.yaml
    to: proxy

  - { name: Gemini, source: ../rules/custom/Gemini.yaml, to: gemini }
  - { name: OpenAI, source: ../rules/custom/OpenAI.yaml, to: openai }
  - { name: Anthropic, source: ../rules/custom/Anthropic.yaml, to: anthropic }
  - { name: Apple-AI, source: ../rules/custom/Apple-AI.yaml, to: appleai }
  - { name: opencode, source: ../rules/custom/opencode.yaml, to: opencode }
  - { name: zai, source: ../rules/custom/zai.yaml, to: zai }
  - { name: grok, source: ../rules/custom/grok.yaml, to: grok }
  - { name: 1024proxy, source: ../rules/custom/1024proxy.yaml, to: 1024proxy }
  - { name: dev, source: ../rules/custom/dev.yaml, to: dev }
  - { name: ptcg, source: ../rules/custom/ptcg.yaml, to: ptcg }
  - { name: Japan, source: ../rules/custom/Japan.yaml, to: japansite }
  - { name: Adult, source: ../rules/custom/Adult.yaml, to: adultnsfw }

  - { name: "Microsoft", source: geosite:microsoft, to: microsoft }
  - { name: PayPal, source: geosite:paypal, to: paypal }
  - { name: Apple, source: geosite:apple, to: apple }

  - { name: ChinaMax, source: geosite:cn, to: direct }
  - { name: Lan, source: ../rules/custom/Lan.yaml, to: direct }
  - { name: cftunnel, source: ../rules/custom/cftunnel.yaml, to: direct }
  - { name: geoip-cn, source: geoip:cn, to: direct }

  - { name: Facebook, source: geosite:facebook, to: proxy }
  - { name: Instagram, source: geosite:instagram, to: proxy }
  - { name: Spotify, source: geosite:spotify, to: proxy }
  - { name: Telegram, source: geosite:telegram, to: proxy }
  - { name: TikTok, source: geosite:tiktok, to: proxy }
  - { name: Twitter, source: geosite:twitter, to: proxy }
  - { name: YouTube, source: geosite:youtube, to: proxy }
