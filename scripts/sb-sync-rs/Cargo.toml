[package]
name = "sb-sync"
version = "0.3.0"
edition = "2021"
description = "设备侧 sing-box 配置同步 CLI"

[dependencies]
ureq = { version = "2", features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
url = "2"
libc = "0.2.189"

[profile.release]
opt-level = "z"
lto = true
strip = true
