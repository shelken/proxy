[package]
name = "sb-sync"
version = "0.3.0"
edition = "2021"
description = "设备侧 sing-box 配置同步 CLI"

[dependencies]
ureq = { version = "2", features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
url = "2"
libc = "0.2.189"
serde_yaml = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
tiny_http = "0.12"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
