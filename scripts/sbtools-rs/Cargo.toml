[package]
name = "sbtools"
version = "0.7.2"
edition = "2024"
description = "设备侧 sing-box 配置同步 CLI"

[dependencies]
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
percent-encoding = "2"
regex = "1"
url = "2"
serde_yaml_ng = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
rand = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal"] }
hex = "0.4"
