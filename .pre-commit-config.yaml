# pre-commit 框架配置：按改动范围分组触发，与 ci-sbtools.yml 的 paths 口径一致。
# 接线（每克隆一次）：pre-commit install
# 临时跳过单次提交：git commit --no-verify
# 沙箱网络行为测试（TUN/netns）不在这里跑：宿主机上会破坏在用的网络，
# 走 just test-sandbox 在 VM 内执行。
repos:
  - repo: local
    hooks:
      # Rust workspace：格式化 + 严格 lint + 全量测试
      - id: check-rust
        name: cargo fmt + clippy + test
        entry: just check-rust
        language: system
        files: ^(scripts/sbtools-rs/|Cargo\.(toml|lock)$)
        pass_filenames: false
      # 底模与装配器：modules/template 一致 + 结构 check + 废弃写法 + 模板测试
      - id: check-template
        name: sing-box 底模检查
        entry: just check-template
        language: system
        files: ^(config/sing-box/|scripts/template-build\.(ts|test\.ts)$)
        pass_filenames: false
      # 清单与底模的 tag 契约
      - id: rules-check
        name: 规则清单契约
        entry: just rules-check
        language: system
        files: ^config/rules/
        pass_filenames: false
