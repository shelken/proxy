# prek 钩子配置：按改动范围分组触发，与 ci-sbtools.yml 的 paths 口径一致。
# 接线（每克隆一次）：mise run setup（即 prek install）
# 临时跳过单次提交：git commit --no-verify
# 沙箱网络行为测试（TUN/netns）不在这里跑：宿主机上会破坏在用的网络，
# 走 just test-sandbox 在 VM 内执行。
repos:
  - repo: local
    hooks:
      # 文档等不改变代码行为的改动，不必付出全量测试成本
      - id: check-rust-fast
        name: cargo fmt + machete + clippy
        entry: just check-rust-fast
        language: system
        files: ^(scripts/sbtools-rs/|Cargo\.(toml|lock)$)
        pass_filenames: false
      - id: check-rust-test
        name: cargo test
        entry: just check-rust-test
        language: system
        files: ^(scripts/sbtools-rs/(src/|tests/|build\.rs$|Cargo\.toml$)|Cargo\.(toml|lock)$)
        pass_filenames: false
      # 底模与装配器：settings/base/platforms 与三份 template 一致 + 结构 check + 废弃写法 + 模板测试
      - id: check-template
        name: sing-box 底模检查
        entry: just check-template
        language: system
        files: ^(config/sing-box/|scripts/(build-config|settings)\.ts$|scripts/merge-variant-fixture\.sh$)
        pass_filenames: false
      - id: check-justfile
        name: justfile 废弃写法检查
        entry: just check-deprecated
        language: system
        files: ^justfile$
        pass_filenames: false
      # 生成器与规则编译器的单元测试（settings 校验、AST、三端发射）
      - id: check-rules
        name: 规则生成与编译单测
        entry: just check-rules
        language: system
        files: ^(config/rules/|config/sing-box/settings\.yaml$|scripts/fixtures/|scripts/(rules-compile|build-config|settings)(\.test)?\.ts$)
        pass_filenames: false
