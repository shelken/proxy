# pre-commit 框架配置：按改动范围分组触发，与 ci-sbtools.yml 的 paths 口径一致。
# 接线（每克隆一次）：pre-commit install
# 临时跳过单次提交：git commit --no-verify
# 沙箱网络行为测试（TUN/netns）不在这里跑：宿主机上会破坏在用的网络，
# 走 just test-sandbox 在 VM 内执行。
repos:
  - repo: local
    hooks:
      # 文档等不改变代码行为的改动，不必付出全量测试成本
      - id: check-rust-fast
        name: cargo fmt + machete + clippy
        entry: just check-rust-fast
        language: system
        files: ^(scripts/sbtools-rs/|Cargo\.(toml|lock)$)
        pass_filenames: false
      - id: check-rust-test
        name: cargo test
        entry: just check-rust-test
        language: system
        files: ^(scripts/sbtools-rs/(src/|tests/|build\.rs$|Cargo\.toml$)|Cargo\.(toml|lock)$)
        pass_filenames: false
      # 底模与装配器：modules/template 一致 + 结构 check + 废弃写法 + 模板测试
      - id: check-template
        name: sing-box 底模检查
        entry: just check-template
        language: system
        files: ^(config/sing-box/|scripts/merge-ios-template\.sh$)
        pass_filenames: false
      - id: check-justfile
        name: justfile 废弃写法检查
        entry: just check-deprecated
        language: system
        files: ^justfile$
        pass_filenames: false
      # 清单与底模的 tag 契约（编译器改动会改变这份契约）
      - id: rules-check
        name: 规则清单契约
        entry: just rules-check
        language: system
        files: ^(config/rules/|scripts/rules-compile(\.test)?\.ts$)
        pass_filenames: false
